[databases]
recruiter_db = host=db port=5432 dbname=recruiter_db

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 500
default_pool_size = 25
reserve_pool_size = 5
ignore_startup_parameters = extra_float_digits
