version: '3.8'

services:
  db:
    # We use a pre-packaged Postgres image that already has pgvector compiled.
    image: pgvector/pgvector:pg16
    container_name: recruiter_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: recruiter_db
    ports:
      - "5432:5432"
    volumes:
      - "postgres_data:/var/lib/postgresql/data"

  redis:
    # Alpine is a stripped-down, ultra-lightweight Linux distribution.
    image: redis:7-alpine
    container_name: recruiter_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - "redis_data:/data"

volumes:
  postgres_data:
  redis_data: