[project]
name = "ai-recruiter"
version = "0.2.0"
description = "Evidence-Based Technical Vetting Platform & Tenant-Isolated MCP Server"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14.0",
    "celery>=5.4.0",
    "fastapi>=0.115.0",
    "fastmcp>=2.0.0",
    "httpx>=0.28.0",
    "langchain-core>=0.3.0",
    "langchain-groq>=0.2.0",
    "langgraph>=0.2.0",
    "pgvector>=0.3.6",
    "psycopg[binary]>=3.2.0",
    "psycopg2-binary>=2.9.10",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "pypdf>=5.0.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.18",
    "redis>=5.2.0",
    "SQLAlchemy>=2.0.36",
    "tree-sitter>=0.24.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q"
asyncio_mode = "auto"
